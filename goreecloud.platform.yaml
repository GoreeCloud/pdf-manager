health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and verify backup scope for persistent document-library state before any production dependency exists.
      - Separate application metadata/state protection from protection of user-owned original documents where their storage authority differs.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration, integrity, authorization, retention, and document accessibility before recovery-ready claims.
  export:
    required: true
    requirements:
      - Provide user-controlled export for stored documents, relevant metadata, annotations, workflows, and configuration where applicable.
  portability:
    required: true
    requirements:
      - Preserve ordinary interoperable document formats and avoid making GoreeCloud PDF Manager a prerequisite for continued access to user documents.

