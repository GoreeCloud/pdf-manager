health:
  health_endpoint: /api/v1/info/status
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect deployment configuration and any durable job/application state without treating temporary document-processing files as permanent records.
  restore:
    required: true
    requirements:
      - Validate clean-target restore and rollback before production qualification.
  export:
    required: true
    requirements:
      - Keep user document outputs in standard portable formats and document any durable application-state export that becomes necessary.
  portability:
    required: true
    requirements:
      - Avoid mandatory proprietary control planes for core self-hosted operation.

external_dependencies:
  - name: Java
    purpose: Application runtime and build toolchain.
    required: true
    version_constraint: "25"
  - name: Tesseract
    purpose: Optional OCR processing.
    required: false
    version_constraint: null
  - name: LibreOffice
    purpose: Optional document conversion paths.
    required: false
    version_constraint: null
  - name: Ghostscript
    purpose: Optional PDF processing and optimization paths.
    required: false
    version_constraint: null

compatibility:
  platform_contract: "2.0"
  glaze_ui_required: "1.7.0"
  requires:
    - goreecloud-platform-contract==2.0
    - glaze-ui==1.7.0
  provides:
    - goreecloud-pdf-manager-development
    - pdf-processing-api-v1

