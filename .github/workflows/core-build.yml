name: Open-core build diagnostics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-entrypoint:
    name: Local developer helper syntax and contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash -n scripts/dev-core.sh
      - run: ./scripts/dev-core.sh verify
      - run: ./scripts/dev-core.sh help

  desktop-lockfile:
    name: Desktop Cargo metadata and policy (not a desktop build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify lockfile metadata without running build scripts
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  java-core:
    name: Java 25 core compile and CORS regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STIRLING_FLAVOR: core
      DISABLE_ADDITIONAL_FEATURES: "true"
      ENABLE_SAAS: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 (verified 2026-11-08)
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.7.1"
      - name: Test CORS and PDF merge, split and rotation controllers
        run: |
          gradle :stirling-pdf:test \
            --tests "stirling.software.SPDF.config.WebMvcConfigTest" \
            --tests "stirling.software.SPDF.config.InitialSetupTest" \
            --tests "stirling.software.SPDF.config.OpenApiConfigTest" \
            --tests "stirling.software.SPDF.controller.api.MergeControllerTest" \
            --tests "stirling.software.SPDF.controller.api.MalformedPdfMergeTest" \
            --tests "stirling.software.SPDF.controller.api.MergeControllerMoreTest" \
            --tests "stirling.software.SPDF.controller.api.SplitPDFControllerTest" \
            --tests "stirling.software.SPDF.controller.api.RotationControllerTest" \
            -PbuildWithFrontend=false --no-daemon --stacktrace
      - name: Validate nonpublishing Spring Boot core JAR and excluded modules
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_verify_core_jar.py" -v
          gradle :stirling-pdf:bootJar -PbuildWithFrontend=false --no-daemon --stacktrace
          mapfile -t jars < <(find app/core/build/libs -maxdepth 1 -type f -name '*.jar' | sort)
          test "${#jars[@]}" -eq 1
          python3 scripts/verify_core_jar.py --jar "${jars[0]}"
          python3 -m unittest discover -s scripts/tests -p test_runtime_jar_inventory.py -v
          python3 scripts/runtime_jar_inventory.py --jar "${jars[0]}" --output /tmp/gcpdf-core-libraries-a.json
          python3 scripts/runtime_jar_inventory.py --jar "${jars[0]}" --output /tmp/gcpdf-core-libraries-b.json
          cmp /tmp/gcpdf-core-libraries-a.json /tmp/gcpdf-core-libraries-b.json
      - name: Prepare PDF page and text verification utilities for synthetic CI fixtures
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils
          fi
          pdfinfo -v
          pdftotext -v
      - name: Exercise actual core JVM health and synthetic PDF merge on loopback
        run: |
          python3 -m unittest discover -s scripts/tests -p test_smoke_core_http.py -v
          python3 -m unittest discover -s scripts/tests -p test_smoke_pdf_semantics.py -v
          python3 -m unittest discover -s scripts/tests -p test_smoke_invalid_upload.py -v
          jar_path="$(find app/core/build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$jar_path"
          python3 scripts/smoke_core_http.py --jar "$jar_path" --startup-timeout 150

  frontend-core:
    name: Node 24 open-core frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified 2026-11-08)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Storybook docgen glob wildcard compatibility
        run: node scripts/verify-docgen-glob.mjs
      - name: Check sandboxed development browser scripts
        run: |
          node --check scripts/generate-og-image.mjs
          node --check scripts/sample-pdf/generate.mjs
      - name: Typecheck the open-core frontend
        run: npx --no-install tsc --noEmit --project tsconfig.core.vite.json
      - name: Verify update channel cannot call upstream servers
        run: npx --no-install vitest run src/editor/core/services/updateService.test.ts
      - name: Verify commercial Vite flavors are rejected
        run: |
          if npx --no-install vite build --mode proprietary > /tmp/rejected-build.log 2>&1; then
            echo "ERROR: proprietary build was unexpectedly accepted"
            exit 1
          fi
          grep -q "Disallowed build mode: proprietary" /tmp/rejected-build.log || {
            cat /tmp/rejected-build.log
            echo "ERROR: rejection did not come from GoreeCloud core-only policy"
            exit 1
          }
      - name: Verify legal policy link safety and UI presentation
        run: |
          npx --no-install vitest run src/editor/core/utils/serviceLegalHref.test.ts src/editor/core/components/shared/LegalPolicySurfaces.test.tsx
      - name: Build open-core frontend
        run: npx --no-install vite build --mode core
