name: Import integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  licensing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Python syntax
        run: python3 -m py_compile scripts/verify_import.py scripts/verify_tauri_permissions.py
      - name: Verify licensing boundaries and provenance
        run: python3 scripts/verify_import.py
      - name: Deny broad desktop WebView FS and HTTP access
        run: python3 scripts/verify_tauri_permissions.py
