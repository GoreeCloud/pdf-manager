name: Validate PDF Manager

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pdf-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Source and governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Validate GoreeCloud source boundary
        run: ./scripts/verify-goreecloud-boundary.sh

  backend:
    name: Core build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Compile
        run: ./gradlew :stirling-pdf:compileJava --no-daemon

      - name: Test core modules
        run: ./gradlew :common:test :stirling-pdf:test --no-daemon

      - name: Build application
        run: ./gradlew :stirling-pdf:bootJar --no-daemon
