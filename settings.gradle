pluginManagement {
    repositories {
        var gradlePluginPortalUrl = System.getenv("MAVEN_PUBLIC_URL") ?: ""
        if (!gradlePluginPortalUrl.isEmpty()){
            maven {
                url gradlePluginPortalUrl + "/gradle"
                credentials(PasswordCredentials) {
                    username System.getenv('MAVEN_USER') ?: ""
                    password System.getenv('MAVEN_PASSWORD') ?: ""
                }
                authentication {
                    basic(BasicAuthentication)
                }
                allowInsecureProtocol true
            }
        }
        gradlePluginPortal()
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'GoreeCloud PDF Manager'

// GoreeCloud PDF Manager: redistributable, MIT-licensed core modules only.
// The separate Stirling commercial modules are intentionally not imported.
// Reject requests for excluded commercial flavors, instead of silently ignoring them.
def requestedFlavor = System.getenv('STIRLING_FLAVOR')
if (requestedFlavor && requestedFlavor.toLowerCase() != 'core') {
    throw new GradleException('GoreeCloud PDF Manager only distributes the MIT core flavor')
}
if ('true'.equalsIgnoreCase(System.getenv('ENABLE_SAAS'))) {
    throw new GradleException('SaaS/commercial modules are not distributed in this repository')
}
gradle.ext.disableAdditional = true
gradle.ext.enableSaas = false

include 'stirling-pdf', 'common'
project(':stirling-pdf').projectDir = file('app/core')
project(':common').projectDir = file('app/common')
